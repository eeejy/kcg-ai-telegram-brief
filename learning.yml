items:
  - term: 생성형 AI
    definition: 학습한 패턴을 바탕으로 텍스트·이미지·음성·코드 같은 새로운 콘텐츠를 만드는 인공지능입니다.
    relevance: 보고서 초안, 민원 분류, 상황보고 정리에 활용할 수 있지만 사실 확인과 비공개정보 통제가 필요합니다.
  - term: LLM
    definition: 대규모 텍스트를 학습해 문장을 이해하고 생성하는 대규모 언어모델입니다.
    relevance: 규정 검색, 문서 요약, 질의응답의 기반이며 답변 근거와 환각 여부를 확인해야 합니다.
  - term: RAG
    definition: AI가 답변하기 전에 내부 문서나 데이터베이스에서 관련 근거를 검색해 함께 활용하는 방식입니다.
    relevance: 해양경찰 규정·매뉴얼 기반 질의응답의 정확성과 출처 제시 능력을 높이는 데 적합합니다.
  - term: AI 에이전트
    definition: 목표를 받아 필요한 작업 순서를 정하고 도구를 사용해 여러 단계를 수행하는 AI 시스템입니다.
    relevance: 자료 수집·분류·보고서 작성 자동화에 활용할 수 있어 권한과 승인 절차가 중요합니다.
  - term: 멀티모달 AI
    definition: 텍스트뿐 아니라 이미지·영상·음성·센서 정보를 함께 이해하는 인공지능입니다.
    relevance: 해상 영상, 무전 음성, 선박 정보와 상황보고를 함께 분석하는 업무와 관련성이 높습니다.
  - term: 컴퓨터 비전
    definition: 사진과 영상에서 객체·행동·상황을 탐지하고 분류하는 인공지능 기술입니다.
    relevance: 선종 식별, 위험행동 탐지, 수색구조, 해양오염 감시에 활용할 수 있습니다.
  - term: 디지털 트윈
    definition: 실제 환경이나 장비의 상태를 데이터로 연결한 가상 모델에서 상황을 분석·예측하는 기술입니다.
    relevance: 항만·연안 위험 예측, 재난 대응 훈련, 장비 운영 최적화에 활용할 수 있습니다.
  - term: 엣지 AI
    definition: 데이터를 중앙 서버로 모두 보내지 않고 카메라·드론·선박 등 현장 장비에서 직접 AI를 실행하는 방식입니다.
    relevance: 통신이 불안정한 해상에서 지연을 줄이고 민감정보의 외부 전송을 최소화할 수 있습니다.
  - term: 설명가능 AI(XAI)
    definition: AI가 특정 판단이나 예측을 내린 이유를 사람이 이해할 수 있도록 설명하는 기술과 방법입니다.
    relevance: 단속·위험판단처럼 책임성과 이의제기가 중요한 공공업무에서 특히 필요합니다.
  - term: 합성데이터
    definition: 실제 데이터의 특성을 모사해 인공적으로 만든 학습·시험용 데이터입니다.
    relevance: 희귀 해양사고나 개인정보가 포함된 자료가 부족할 때 보완할 수 있지만 실제성 검증이 필요합니다.
  - term: MLOps
    definition: AI 모델의 개발·배포·성능감시·재학습을 지속적으로 관리하는 운영 체계입니다.
    relevance: 시범사업을 실제 현장 서비스로 전환하고 정확도 저하를 조기에 발견하는 데 필요합니다.
  - term: 고영향 AI
    definition: 사람의 생명·안전·기본권 등에 중대한 영향을 줄 수 있어 강화된 관리가 필요한 인공지능입니다.
    relevance: 수색구조나 치안 의사결정 지원 AI는 영향도 평가, 인간의 감독, 기록 관리 여부를 검토해야 합니다.

